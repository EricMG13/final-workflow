name: issuer-library-browser

# The issuer library's browser walk (chromium, firefox) with fault capture. Weekly with the
# nightly suite, by hand, and on pull requests that touch the app or the engine it runs
# (about 10 runner-minutes per matching PR). Scheduled runs use the default branch only.
on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/issuer-library/**"
      - "src/**"
      - ".github/workflows/issuer-library-browser.yml"

concurrency:
  group: issuer-library-browser-${{ github.ref }}
  # Only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issuer-library-browser:
    name: issuer library browser walk (chromium, firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/issuer-library/go.mod
      # Playwright is a test-only tool, pinned and installed outside the project lock.
      - run: uv venv "$RUNNER_TEMP/pw"
      - run: uv pip install --python "$RUNNER_TEMP/pw/bin/python" playwright==1.64.0
      - run: $RUNNER_TEMP/pw/bin/python -m playwright install --with-deps chromium firefox
      - env:
          # clean_env() prepends /usr/local/go/bin; GOTOOLCHAIN forces the go.mod toolchain regardless.
          GOTOOLCHAIN: go1.24.0
          FW_PYTHON: ${{ github.workspace }}/.venv/bin/python
          FW_PLAYWRIGHT_PYTHON: ${{ runner.temp }}/pw/bin/python
          FW_BROWSER_OUT: ${{ runner.temp }}/browser
        run: python3 apps/issuer-library/validate.py browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issuer-library-browser
          path: ${{ runner.temp }}/browser
          retention-days: 14
