name: nightly-tests

# The full suite, slow tests included, every night at 01:00 UTC. Work in progress runs fast
# targeted tests only (AGENTS.md); this run covers what those skip. GitHub runs scheduled
# workflows from the default branch only; workflow_dispatch runs it on demand.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  pytest:
    name: pytest shard ${{ matrix.shard }} of 6
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - run: >-
          uv run python tools/nightly_tests.py run
          --shard ${{ matrix.shard }} --shards 6 --out results --minutes 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: results/
          retention-days: 14

  report:
    name: compare with known failures
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: >-
          python tools/nightly_tests.py report
          --shards 6 --known tests/nightly-known-failures.txt results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: results/failures.txt
          retention-days: 30

  go:
    name: issuer library Go server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/issuer-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/issuer-library/go.mod
      - run: go vet ./...
      - run: go test -race ./...
