name: quality-gate

on:
  pull_request:
  # Started hourly on main by the PR manager; off a PR the changed-code gate checks the last merge.
  workflow_dispatch:

jobs:
  changed-code:
    name: changed code passes ruff, format, complexity and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - run: uv run python tools/quality_gate.py --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"

  issuer-library-quick:
    name: issuer library quick gate (fixture, node, python tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # jsdom is a test-only tool, pinned and installed outside the project lock (docs/QUALITY-GATE.md).
      - run: npm install --no-save --prefix "$RUNNER_TEMP/dom" jsdom@26.1.0
      - env:
          FW_PYTHON: ${{ github.workspace }}/.venv/bin/python
          ISSUER_LIBRARY_JSDOM: ${{ runner.temp }}/dom/node_modules/jsdom
        run: python3 apps/issuer-library/validate.py quick
