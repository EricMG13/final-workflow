name: quality-gate

on:
  pull_request:

jobs:
  changed-code:
    name: changed code passes ruff, format, complexity and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - run: uv run python tools/quality_gate.py --base "origin/${{ github.base_ref }}"
